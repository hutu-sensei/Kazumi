name: build-apk

# 只做一件事：把当前分支编成可安装的 arm64 APK，产物在 Actions 页面下载。
on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      # 非致命检查：把编译期的错误和警告写进 Job Summary，方便直接看
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          echo "## flutter analyze 结果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 analyze.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat analyze.log

      # 上游对 jni 包有个 build-id 兼容处理，照抄以免链接失败
      - name: Patch jni build flags
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
        continue-on-error: true

      - name: Build APK (split per ABI)
        # 测试版使用独立包名，可与正式版共存；正式构建不设该变量，包名保持原样
        env:
          ORG_GRADLE_PROJECT_kazumiAppIdSuffix: .cast
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-cast-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
